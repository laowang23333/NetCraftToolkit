name: Build NetCraftToolkit

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 拉取源码
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 设置 Java 17
      # Minecraft 1.20.1 + Forge 47.4.13 使用 Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. 安装 Gradle 8.8
      #
      # 重要：
      # ForgeGradle 6.0.x 不支持 Gradle 9.x
      # GitHub Runner 自带的 Gradle 目前可能是 9.x，
      # 所以这里明确安装并使用 Gradle 8.8。
      # ============================================================
      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # ============================================================
      # 4. 显示构建环境
      # ============================================================
      - name: Check Java and Gradle
        run: |
          echo "===== Java ====="
          java -version

          echo ""
          echo "===== Gradle ====="
          gradle --version

      # ============================================================
      # 5. 生成 Gradle Wrapper
      #
      # 这里执行的是上面安装好的 Gradle 8.8，
      # 不会再调用 Runner 自带的 Gradle 9.7.1。
      # ============================================================
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.8 --distribution-type bin

      # ============================================================
      # 6. 使用 Wrapper 构建
      # ============================================================
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      # ============================================================
      # 7. 上传构建出来的 JAR
      # ============================================================
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetCraftToolkit
          path: build/libs/*.jar
          if-no-files-found: error

      # ============================================================
      # 8. 构建失败时也保留日志/报告
      # ============================================================
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/logs/
          if-no-files-found: ignore
